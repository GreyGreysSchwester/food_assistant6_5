<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曦曦饮食助手</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
body{
    position: relative;
    min-height: 97vh;
    overflow-x: hidden;
    font-family:'Microsoft YaHei',Arial,sans-serif;

}
body::before{
    content:'';
    position: absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background-image:url('/static/catcook.png');
    background-size:cover;
    background-position:center;
    opacity:0.5;
    z-index:-1;
    pointer-events:none;
}

.header{
    text-align:center;
    padding:20px;
    background:#fff1d16e;
}

.container{
    flex:1;
    width:70%;
    max-width:none;

    height: 100%;

    margin:10px auto;

    background:#ffffffd9;
    border-radius:20px;
    box-sizing:border-box;
    padding:40px;

    box-shadow:
        0 5px 15px rgba(0,0,0,.1);
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.option{
    display:block;
    margin:12px 0;
    padding:12px;

    border:1px solid #ddd;
    border-radius:12px;

    cursor:pointer;
}

input[type=text]{
    width:100%;
    padding:12px;

    border-radius:10px;
    border:1px solid #ddd;
}

button{
    margin-top:20px;

    padding:12px 24px;

    border:none;
    border-radius:12px;

    background:#8fd3ff;
    color:white;

    cursor:pointer;
}

.result-box{
    background:#fafafa;
    padding:15px;
    border-radius:12px;
}

.thinking-box{
    font: size 18px;
    color:#ff6b9d;
    text-align:center;
    padding:20px;
    animation:dots 1.2s infinite;
}
@keyframes dots{
    0%{content:'';}
    50%{content:'.';}
    100%{content:'...';}
}

</style>
</head>
<body>
<div class="header">
<h1>🐱曦曦饮食助手🍱</h1>
</div>

<div class="container">

<div id="page0" class="page active">
<h2>欢迎使用曦曦饮食助手</h2>
<p>点击开始进入饮食偏好采集。</p>
<button onclick="nextPage(1)">开始</button>
</div>

<div id="page1" class="page">
<h2>请问您的偏好口味是？</h2>
<label class="option"><input type="radio" name="taste" value="清淡"> 清淡</label>
<label class="option"><input type="radio" name="taste" value="麻辣"> 麻辣</label>
<label class="option"><input type="radio" name="taste" value="适中"> 适中</label>
<button onclick="nextPage(2)">下一步</button>
</div>

<div id="page2" class="page">
<h2>请问您有忌口吗？</h2>
<input type="text" id="avoid" placeholder="请输入忌口内容">
<button onclick="nextPage(3)">下一步</button>
</div>

<div id="page3" class="page">
<h2>请问您有过敏原吗？</h2>
<input type="text" id="allergy" placeholder="请输入过敏原">
<button onclick="nextPage(4)">下一步</button>
</div>

<div id="page4" class="page">
<h2>请问您有什么健康目标吗？</h2>
<label class="option"><input type="radio" name="goal" value="减肥"> 减肥</label>
<label class="option"><input type="radio" name="goal" value="增肌"> 增肌</label>
<label class="option"><input type="radio" name="goal" value="养身"> 养身</label>
<button onclick="generateRecipe()">生成食谱</button>
</div>

<div id="page5" class="page">
<h2>🍽️ 食谱推荐</h2>

<!-- ⭐ 思考动画区域（新增） -->
    <div id="recipeLoading">
        <video
            id="thinkingVideo"
            autoplay
            loop
            muted
            playsinline
            width="403">
            <source 
                src="/static/thinking.mp4" 
                type="video/mp4">  
        </video>
           <!-- <div class="cat-animation"></div-->
            <p>
                🐱 曦曦正在思考今日专属食谱...
            </p>
    </div>

<div 
    id="recipeResult" 
    class="result-box"
    style="display:none;">
</div>
<button id="nextBtn"
    onclick="goNutrition()"
    style="display:none;">
    下一步
    </button>
</div>

<div id="page6" class="page">
<h2>🥗 营养分析</h2>
<div id="nutritionLoading">
    <video
        autoplay
        loop
        muted
        playsinline
        width="403">
        <source 
            src="/static/thinking.mp4" 
            type="video/mp4">
    </video>
    <p>
        🐱 曦曦正在分析营养成分...
    </p>
</div>
<div id="nutritionResult" class="result-box" style="display:none;"></div>

</div>

<script>
let recipeText='';
let nutritionText='';

function nextPage(n){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.getElementById('page'+n).classList.add('active');
}

async function generateRecipe(){

    const taste =
        document.querySelector(
            'input[name="taste"]:checked'
        )?.value || '';

    const avoid =
        document.getElementById(
            'avoid'
        ).value || '无';

    const allergy =
        document.getElementById(
            'allergy'
        ).value || '无';

    const goal =
        document.querySelector(
            'input[name="goal"]:checked'
        )?.value || '';

    const prompt =
        `偏好口味:${taste}；忌口:${avoid}；过敏原:${allergy}；健康目标:${goal}。请先生成食谱推荐，并单独给出营养分析。`;

    // 立即进入加载页
    nextPage(5);

    document.getElementById(
        'recipeLoading'
    ).style.display = 'block';

    document.getElementById(
        'recipeResult'
    ).style.display = 'none';

    document.getElementById(
        'nextBtn'
    ).style.display = 'none';

    try{

        const response =
            await fetch(
                '/api/chat',
                {
                    method:'POST',
                    headers:{
                        'Content-Type':'application/json'
                    },
                    body:JSON.stringify({
                        message:prompt
                    })
                }
            );

        const data =
            await response.json();

        const txt =
            data.response || '';

        const parts =
            txt.split(/营养分析[:：]/);

        recipeText =
            parts[0] || txt;

        nutritionText =
            parts.length > 1
                ? ('营养分析：'+parts[1])
                : '未检测到营养分析内容';

        // 隐藏视频
        document.getElementById(
            'recipeLoading'
        ).style.display = 'none';

        // 显示结果
        document.getElementById(
            'recipeResult'
        ).style.display = 'block';

        document.getElementById(
            'nextBtn'
        ).style.display = 'inline-block';

        document.getElementById(
            'recipeResult'
        ).innerHTML =
            marked.parse(recipeText);

        document.getElementById(
            'nutritionResult'
        ).innerHTML =
            marked.parse(nutritionText);

    }
    catch(e){

        document.getElementById(
            'recipeLoading'
        ).style.display = 'none';

        document.getElementById(
            'recipeResult'
        ).style.display = 'block';

        document.getElementById(
            'recipeResult'
        ).innerHTML =
            '生成失败';
    }
}

async function loadNutrition(){

    try{

        const loading =
            document.getElementById(
                'nutritionLoading'
            );

        const result =
            document.getElementById(
                'nutritionResult'
            );

        // 显示动画
        loading.style.display = 'block';

        // 隐藏结果
        result.style.display = 'none';

        const response = await fetch(
            '/api/nutrition',
            {
                method:'POST'
            }
        );

        const data = await response.json();

        // 隐藏动画
        loading.style.display = 'none';

        // 显示结果
        result.style.display = 'block';

        result.innerHTML =
            marked.parse(
                data.nutrition || '暂无数据'
            );

    }catch(e){

        document.getElementById(
            'nutritionLoading'
        ).style.display = 'none';

        document.getElementById(
            'nutritionResult'
        ).style.display = 'block';

        document.getElementById(
            'nutritionResult'
        ).innerHTML =
            '营养分析生成失败';

    }
}
async function goNutrition(){

    nextPage(6);
    await loadNutrition();
}
</script>
</body>
</html>
